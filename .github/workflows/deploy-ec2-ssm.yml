name: Deploy EC2 (SSM)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-ssm
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install + unit tests
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest
          python -m compileall app
          pytest -q
        env:
          RESUME_LLM_CONDENSE: "false"
          RESUME_AGENT_PIPELINE: "false"
          RESUME_LLM_PARSE_FALLBACK: "false"
          RESUME_LLM_LINE_EXTRACT: "false"
      - name: Golden fidelity gate
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr libreoffice-writer
          python scripts/corpus_quality_eval.py --golden --formats aptino,capgemini,suresh
        env:
          RESUME_LLM_CONDENSE: "false"
          RESUME_AGENT_PIPELINE: "false"
          RESUME_LLM_PARSE_FALLBACK: "false"
          RESUME_LLM_LINE_EXTRACT: "false"
          RESUME_OCR_ENABLED: "true"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      EC2_REPO_DIR: ${{ secrets.EC2_REPO_DIR }}
      RESUME_ENV_SSM_PARAM: /resume-generator/prod/env
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Require instance id
        run: |
          test -n "${EC2_INSTANCE_ID}" || { echo "Missing secret EC2_INSTANCE_ID"; exit 1; }
          echo "EC2_REPO_DIR=${EC2_REPO_DIR:-/home/ubuntu/Resume_generator}" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          chmod +x backend/deploy/ssm-deploy.sh backend/deploy/ensure-env-from-ssm.sh backend/deploy/update-ec2.sh
          EC2_REPO_DIR="${EC2_REPO_DIR:-/home/ubuntu/Resume_generator}" bash backend/deploy/ssm-deploy.sh

      - name: Health check
        run: |
          # Prefer public IP secret; otherwise resolve from EC2 API.
          HOST="${{ secrets.EC2_PUBLIC_HOST }}"
          if [ -z "$HOST" ]; then
            HOST="$(aws ec2 describe-instances \
              --region ap-south-1 \
              --instance-ids "$EC2_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)"
          fi
          echo "Checking http://${HOST}:8000/api/health"
          for i in 1 2 3 4 5; do
            if curl -fsS "http://${HOST}:8000/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          exit 1
