name: Deploy EC2 (SSM)

# CI/CD: every push to main runs tests, then deploys the API to EC2 via SSM.
# Manual re-deploy: Actions → "Deploy EC2 (SSM)" → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-ec2-ssm.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ec2-ssm
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall app
      - name: Unit tests
        run: |
          set +e
          python -m pytest -q --tb=short | tee pytest-out.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Unit tests"
            echo '```'
            tail -n 120 pytest-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        env:
          RESUME_LLM_CONDENSE: "false"
          RESUME_AGENT_PIPELINE: "false"
          RESUME_LLM_PARSE_FALLBACK: "false"
          RESUME_LLM_LINE_EXTRACT: "false"
      - name: Golden fidelity gate
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libreoffice-writer
          python scripts/corpus_quality_eval.py --golden --formats aptino,capgemini,suresh
        env:
          RESUME_LLM_CONDENSE: "false"
          RESUME_AGENT_PIPELINE: "false"
          RESUME_LLM_PARSE_FALLBACK: "false"
          RESUME_LLM_LINE_EXTRACT: "false"
          RESUME_OCR_ENABLED: "true"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      EC2_REPO_DIR: ${{ secrets.EC2_REPO_DIR }}
      EC2_PUBLIC_HOST: ${{ secrets.EC2_PUBLIC_HOST }}
      RESUME_ENV_SSM_PARAM: /resume-generator/prod/env
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Require deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "Missing secret: AWS_ACCESS_KEY_ID"; missing=1; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "Missing secret: AWS_SECRET_ACCESS_KEY"; missing=1; fi
          if [ -z "${EC2_INSTANCE_ID}" ]; then echo "Missing secret: EC2_INSTANCE_ID"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets above under Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "EC2_REPO_DIR=${EC2_REPO_DIR:-/home/ubuntu/Resume_generator}" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          chmod +x backend/deploy/ssm-deploy.sh backend/deploy/ensure-env-from-ssm.sh backend/deploy/update-ec2.sh
          EC2_REPO_DIR="${EC2_REPO_DIR:-/home/ubuntu/Resume_generator}" bash backend/deploy/ssm-deploy.sh

      - name: Health check
        run: |
          HOST="${EC2_PUBLIC_HOST}"
          if [ -z "$HOST" ]; then
            HOST="$(aws ec2 describe-instances \
              --region ap-south-1 \
              --instance-ids "$EC2_INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)"
          fi
          if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
            echo "Could not resolve EC2 public IP; set secret EC2_PUBLIC_HOST"
            exit 1
          fi
          echo "Checking http://${HOST}:8000/api/health"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "http://${HOST}:8000/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          exit 1
