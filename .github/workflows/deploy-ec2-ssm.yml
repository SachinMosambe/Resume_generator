name: Deploy EC2 (SSM)

# CI/CD: every push to main (backend/workflow changes) runs tests, then deploys via SSM.
# Manual re-deploy: Actions → "Deploy EC2 (SSM)" → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-ec2-ssm.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ec2-ssm
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall app
      - name: Unit tests
        run: |
          set +e
          python -m pytest -q --tb=short | tee pytest-out.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Unit tests"
            echo '```'
            tail -n 120 pytest-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        env:
          RESUME_LLM_CONDENSE: "false"
          RESUME_AGENT_PIPELINE: "false"
          RESUME_LLM_PARSE_FALLBACK: "false"
          RESUME_LLM_LINE_EXTRACT: "false"
      - name: Golden fidelity gate
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libreoffice-writer
          python scripts/corpus_quality_eval.py --golden --formats aptino,capgemini,suresh
        env:
          RESUME_LLM_CONDENSE: "false"
          RESUME_AGENT_PIPELINE: "false"
          RESUME_LLM_PARSE_FALLBACK: "false"
          RESUME_LLM_LINE_EXTRACT: "false"
          RESUME_OCR_ENABLED: "true"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      # Hardcoded resume-api targets (override later via repo Variables if needed).
      EC2_INSTANCE_ID: i-0fee3dafe7eab0f6c
      EC2_REPO_DIR: /home/ubuntu/Resume_generator
      EC2_PUBLIC_HOST: 13.203.78.62
      RESUME_ENV_SSM_PARAM: /resume-generator/prod/env
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy via SSM
        run: |
          chmod +x backend/deploy/ssm-deploy.sh backend/deploy/ensure-env-from-ssm.sh backend/deploy/update-ec2.sh
          echo "Deploying to ${EC2_INSTANCE_ID} repo=${EC2_REPO_DIR}"
          bash backend/deploy/ssm-deploy.sh

      - name: Health check
        run: |
          echo "Checking http://${EC2_PUBLIC_HOST}:8000/api/health"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "http://${EC2_PUBLIC_HOST}:8000/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          exit 1
